# Coolify: production — CI pushes pacepard-service on every master push (tag production).
# Staging/development: no GHCR push for this image; use production compose or a custom registry tag.
# Env: GHCR_ORG (lowercase), IMAGE_TAG = production
# CI image: ghcr.io/${GHCR_ORG}/pacepard-service:${IMAGE_TAG}
# unauthorized on pull -> register ghcr.io in Coolify or make package public (see docs/coolify-monorepo-setup.md 4.5.1).
services:
  service:
    image: ghcr.io/${GHCR_ORG}/pacepard-service:${IMAGE_TAG}
    pull_policy: always
    restart: unless-stopped
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
