# Coolify: Build Pack = Docker Compose. Point "Docker Compose Location" to this file.
# Env: GHCR_ORG (lowercase), IMAGE_TAG = development | staging | production
# CI image: ghcr.io/${GHCR_ORG}/pacepard-api:${IMAGE_TAG}
services:
  api:
    image: ghcr.io/${GHCR_ORG}/pacepard-api:${IMAGE_TAG}
    pull_policy: always
    restart: unless-stopped
    expose:
      - "5015"
