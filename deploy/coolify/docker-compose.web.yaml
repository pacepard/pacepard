# Coolify: Build Pack = Docker Compose. Point "Docker Compose Location" to this file.
# Set resource env in Coolify (required):
#   GHCR_ORG = GitHub org or user (lowercase), e.g. pacepard
#   IMAGE_TAG = floating tag CI pushes: development | staging | production
# CI image: ghcr.io/${GHCR_ORG}/pacepard-web:${IMAGE_TAG}
#
# If deploy logs show: unauthorized / manifests/staging — GHCR rejected the pull.
# Fix: add ghcr.io credentials in Coolify (Docker registry UI), or make the GHCR package public.
# Never commit PATs into this file; use Coolify / GitHub Actions secrets only.
#
# Large image: if deploy fails after long "Extracting" with exit 255, see docs
# coolify-monorepo-setup.md section 4.5.2 (timeout / OOM / disk).
services:
  web:
    image: ghcr.io/${GHCR_ORG}/pacepard-web:${IMAGE_TAG}
    pull_policy: always
    restart: unless-stopped
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
