<svg width="507" height="294" viewBox="0 0 507 294" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Main Card Background -->
  <rect width="507" height="294" rx="12" fill="#FFFFFF"/>
  
  <!-- Main Content Area -->
  <rect x="20" y="20" width="467" height="254" rx="3" fill="#FFFFFF" stroke="#F0F0F0" stroke-width="0.5"/>
  
  <!-- Form Title Section -->
  <rect x="36" y="36" width="180" height="6" rx="1" fill="#E9E9E7"/>
  
  <!-- Question Heading -->
  <rect x="36" y="52" width="140" height="5" rx="0.5" fill="#37352F" opacity="0.8"/>
  
  <!-- Multiple Choice Options with Letters -->
  <g>
    <!-- Option A -->
    <rect x="36" y="68" width="160" height="16" rx="2" fill="#FAFAFA" stroke="#E9E9E7" stroke-width="0.5"/>
    <rect x="42" y="72" width="8" height="8" rx="1.5" fill="#37352F" opacity="0.9"/>
    <text x="46" y="76" font-family="system-ui, -apple-system" font-size="7" fill="#FFFFFF" font-weight="600" text-anchor="middle" dominant-baseline="central">A</text>
    <text x="56" y="76" font-family="system-ui, -apple-system" font-size="8" fill="#37352F" opacity="0.7" dominant-baseline="central">Online</text>
  </g>
  
  <g>
    <!-- Option B - Selected -->
    <rect x="36" y="88" width="160" height="16" rx="2" fill="#37352F" stroke="#37352F" stroke-width="0.5"/>
    <rect x="42" y="92" width="8" height="8" rx="1.5" fill="#FFFFFF"/>
    <text x="46" y="96" font-family="system-ui, -apple-system" font-size="7" fill="#37352F" font-weight="600" text-anchor="middle" dominant-baseline="central">B</text>
    <text x="56" y="96" font-family="system-ui, -apple-system" font-size="8" fill="#FFFFFF" dominant-baseline="central">In-person</text>
  </g>
  
  <g>
    <!-- Option C -->
    <rect x="36" y="108" width="160" height="16" rx="2" fill="#FAFAFA" stroke="#E9E9E7" stroke-width="0.5"/>
    <rect x="42" y="112" width="8" height="8" rx="1.5" fill="#37352F" opacity="0.9"/>
    <text x="46" y="116" font-family="system-ui, -apple-system" font-size="7" fill="#FFFFFF" font-weight="600" text-anchor="middle" dominant-baseline="central">C</text>
    <text x="56" y="116" font-family="system-ui, -apple-system" font-size="8" fill="#37352F" opacity="0.7" dominant-baseline="central">Hybrid</text>
  </g>
  
  <!-- Conditional Logic Section -->
  <g>
    <!-- When Clause -->
    <rect x="36" y="140" width="360" height="24" rx="2" fill="#FAFAFA" stroke="#E9E9E7" stroke-width="0.5"/>
    <!-- Branch Icon -->
    <path d="M 40 152 L 44 148 L 44 150 L 48 150 L 48 154 L 44 154 L 44 156 Z" fill="#9B9A97" opacity="0.6"/>
    <text x="52" y="156" font-family="system-ui, -apple-system" font-size="8" fill="#37352F" opacity="0.7" font-weight="500">When</text>
    
    <!-- Dropdown 1 -->
    <rect x="96" y="146" width="80" height="12" rx="2" fill="#FFFFFF" stroke="#E9E9E7" stroke-width="0.5"/>
    <text x="100" y="154" font-family="system-ui, -apple-system" font-size="7" fill="#37352F" opacity="0.6">Event type</text>
    <path d="M 170 150 L 172 152 L 170 154" stroke="#9B9A97" stroke-width="1" fill="none" opacity="0.5"/>
    
    <!-- Dropdown 2 -->
    <rect x="184" y="146" width="40" height="12" rx="2" fill="#FFFFFF" stroke="#E9E9E7" stroke-width="0.5"/>
    <text x="188" y="154" font-family="system-ui, -apple-system" font-size="7" fill="#37352F" opacity="0.6">Is</text>
    <path d="M 218 150 L 220 152 L 218 154" stroke="#9B9A97" stroke-width="1" fill="none" opacity="0.5"/>
    
    <!-- Dropdown 3 -->
    <rect x="232" y="146" width="60" height="12" rx="2" fill="#FFFFFF" stroke="#E9E9E7" stroke-width="0.5"/>
    <text x="236" y="154" font-family="system-ui, -apple-system" font-size="7" fill="#37352F" opacity="0.6">In-person</text>
    <path d="M 286 150 L 288 152 L 286 154" stroke="#9B9A97" stroke-width="1" fill="none" opacity="0.5"/>
    
    <!-- Kebab Menu -->
    <circle cx="384" cy="152" r="1.5" fill="#9B9A97" opacity="0.4"/>
    <circle cx="384" cy="152" r="1.5" fill="#9B9A97" opacity="0.4" transform="translate(0, 3)"/>
    <circle cx="384" cy="152" r="1.5" fill="#9B9A97" opacity="0.4" transform="translate(0, 6)"/>
  </g>
  
  <g>
    <!-- Then Clause -->
    <rect x="36" y="172" width="360" height="24" rx="2" fill="#FAFAFA" stroke="#E9E9E7" stroke-width="0.5"/>
    <!-- Lightning Icon -->
    <path d="M 40 180 L 42 184 L 40 184 L 43 188 L 41 188 L 44 192 L 46 188 L 44 188 L 47 184 L 45 184 Z" fill="#1D79FF" opacity="0.7"/>
    <text x="52" y="188" font-family="system-ui, -apple-system" font-size="8" fill="#37352F" opacity="0.7" font-weight="500">Then</text>
    
    <!-- Dropdown 1 -->
    <rect x="96" y="178" width="70" height="12" rx="2" fill="#FFFFFF" stroke="#E9E9E7" stroke-width="0.5"/>
    <text x="100" y="186" font-family="system-ui, -apple-system" font-size="7" fill="#37352F" opacity="0.6">Show blocks</text>
    <path d="M 160 182 L 162 184 L 160 186" stroke="#9B9A97" stroke-width="1" fill="none" opacity="0.5"/>
    
    <!-- Dropdown 2 - Open State -->
    <rect x="174" y="178" width="100" height="12" rx="2" fill="#F7F9FC" stroke="#1D79FF" stroke-width="1" opacity="0.6"/>
    <text x="178" y="186" font-family="system-ui, -apple-system" font-size="7" fill="#37352F" opacity="0.8">Short answer</text>
    <path d="M 268 182 L 270 184 L 268 186" stroke="#1D79FF" stroke-width="1" fill="none" opacity="0.7"/>
    
    <!-- Dropdown Menu Items (Open) -->
    <rect x="174" y="192" width="100" height="40" rx="2" fill="#FFFFFF" stroke="#E9E9E7" stroke-width="0.5"/>
    <rect x="178" y="196" width="92" height="8" rx="1" fill="#F7F9FC"/>
    <text x="180" y="201" font-family="system-ui, -apple-system" font-size="7" fill="#37352F" opacity="0.8">✓ Short answer</text>
    <rect x="178" y="206" width="92" height="8" rx="1" fill="#FAFAFA"/>
    <text x="180" y="211" font-family="system-ui, -apple-system" font-size="7" fill="#37352F" opacity="0.6">Input Title</text>
    <rect x="178" y="216" width="92" height="8" rx="1" fill="#FAFAFA"/>
    <text x="180" y="221" font-family="system-ui, -apple-system" font-size="7" fill="#37352F" opacity="0.6">Input Label</text>
    <rect x="178" y="226" width="92" height="8" rx="1" fill="#FAFAFA"/>
    <text x="180" y="231" font-family="system-ui, -apple-system" font-size="7" fill="#37352F" opacity="0.6">Input Email</text>
    
    <!-- Kebab Menu -->
    <circle cx="384" cy="184" r="1.5" fill="#9B9A97" opacity="0.4"/>
    <circle cx="384" cy="184" r="1.5" fill="#9B9A97" opacity="0.4" transform="translate(0, 3)"/>
    <circle cx="384" cy="184" r="1.5" fill="#9B9A97" opacity="0.4" transform="translate(0, 6)"/>
  </g>
  
  <!-- Input Field with Icon -->
  <g>
    <rect x="36" y="240" width="200" height="20" rx="2" fill="#FAFAFA" stroke="#E9E9E7" stroke-width="0.5"/>
    <text x="42" y="252" font-family="system-ui, -apple-system" font-size="8" fill="#9B9A97" opacity="0.6">Enter team name...</text>
    <!-- Equals Icon at end -->
    <rect x="218" y="245" width="12" height="10" rx="1" fill="none"/>
    <line x1="221" y1="248" x2="227" y2="248" stroke="#9B9A97" stroke-width="1" opacity="0.4"/>
    <line x1="221" y1="252" x2="227" y2="252" stroke="#9B9A97" stroke-width="1" opacity="0.4"/>
  </g>
  
  <!-- Drag Handle Icons (Left of inputs) - Notion Style -->
  <g opacity="0.4">
    <!-- Left column -->
    <circle cx="26" cy="76" r="1" fill="#9B9A97"/>
    <circle cx="26" cy="79" r="1" fill="#9B9A97"/>
    <circle cx="26" cy="82" r="1" fill="#9B9A97"/>
    <!-- Right column -->
    <circle cx="30" cy="76" r="1" fill="#9B9A97"/>
    <circle cx="30" cy="79" r="1" fill="#9B9A97"/>
    <circle cx="30" cy="82" r="1" fill="#9B9A97"/>
  </g>
  
  <!-- Action Icons (Delete, Duplicate, Plus) -->
  <g opacity="0.5">
    <!-- Plus Icon -->
    <rect x="208" y="72" width="10" height="10" rx="1.5" fill="#E9E9E7"/>
    <line x1="213" y1="75" x2="213" y2="79" stroke="#9B9A97" stroke-width="1"/>
    <line x1="210" y1="77" x2="216" y2="77" stroke="#9B9A97" stroke-width="1"/>
    
    <!-- Trash Icon -->
    <rect x="223" y="72" width="10" height="10" rx="1.5" fill="#E9E9E7"/>
    <path d="M 225 75 L 231 75 L 231 77 L 229 77 L 229 79 L 227 79 L 227 77 L 225 77 Z" fill="#9B9A97" opacity="0.6"/>
    
    <!-- Drag Handle -->
    <rect x="238" y="74" width="6" height="6" rx="0.5" fill="#E9E9E7"/>
    <circle cx="240" cy="75.5" r="0.5" fill="#9B9A97"/>
    <circle cx="242" cy="75.5" r="0.5" fill="#9B9A97"/>
    <circle cx="312" cy="77.5" r="0.5" fill="#9B9A97"/>
    <circle cx="242" cy="77.5" r="0.5" fill="#9B9A97"/>
  </g>
  
  <!-- Required Badge Example -->
  <g>
    <circle cx="240" cy="252" r="4" fill="#37352F" opacity="0.1"/>
    <text x="238" y="255" font-family="system-ui, -apple-system" font-size="6" fill="#37352F" opacity="0.8" font-weight="600">*</text>
  </g>
  
  <!-- Page Indicator -->
  <rect x="36" y="220" width="50" height="14" rx="2" fill="#37352F" opacity="0.9"/>
  <text x="46" y="229" font-family="system-ui, -apple-system" font-size="8" fill="#FFFFFF" font-weight="400">1/4 →</text>
</svg>
