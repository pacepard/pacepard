<svg width="507" height="294" viewBox="0 0 507 294" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Main Card Background -->
  <rect width="507" height="294" rx="12" fill="#FFFFFF"/>
  
  <!-- Product Market Fit Survey (Left Top) -->
  <rect x="24" y="24" width="280" height="112" rx="3" fill="#FFFFFF" stroke="#F0F0F0" stroke-width="0.5"/>
  <text x="32" y="42" font-family="system-ui, -apple-system" font-size="11" fill="#37352F" font-weight="500" opacity="0.9">Product Market Fit</text>
  <text x="32" y="60" font-family="system-ui, -apple-system" font-size="9" fill="#37352F" opacity="0.8">How would you feel if you could no longer use Pacepard? *</text>
  
  <!-- Multiple Choice Options with Detailed ABC Badges -->
  <g>
    <!-- Option A -->
    <rect x="32" y="72" width="132" height="16" rx="2" fill="#FAFAFA" stroke="#E9E9E7" stroke-width="0.5"/>
    <rect x="36" y="75" width="10" height="10" rx="1.5" fill="#37352F" opacity="0.9"/>
    <text x="41" y="80" font-family="system-ui, -apple-system" font-size="7" fill="#FFFFFF" font-weight="600" text-anchor="middle" dominant-baseline="central">A</text>
    <text x="50" y="82" font-family="system-ui, -apple-system" font-size="8" fill="#37352F" opacity="0.7" dominant-baseline="central">Very disappointed</text>
  </g>
  
  <g>
    <!-- Option B - Selected -->
    <rect x="32" y="94" width="132" height="16" rx="2" fill="#37352F" stroke="#37352F" stroke-width="0.5"/>
    <rect x="36" y="97" width="10" height="10" rx="1.5" fill="#FFFFFF"/>
    <text x="41" y="102" font-family="system-ui, -apple-system" font-size="7" fill="#37352F" font-weight="600" text-anchor="middle" dominant-baseline="central">B</text>
    <text x="50" y="104" font-family="system-ui, -apple-system" font-size="8" fill="#FFFFFF" dominant-baseline="central">Somewhat disappointed</text>
  </g>
  
  <g>
    <!-- Option C -->
    <rect x="32" y="116" width="132" height="16" rx="2" fill="#FAFAFA" stroke="#E9E9E7" stroke-width="0.5"/>
    <rect x="36" y="119" width="10" height="10" rx="1.5" fill="#37352F" opacity="0.9"/>
    <text x="41" y="124" font-family="system-ui, -apple-system" font-size="7" fill="#FFFFFF" font-weight="600" text-anchor="middle" dominant-baseline="central">C</text>
    <text x="50" y="126" font-family="system-ui, -apple-system" font-size="8" fill="#37352F" opacity="0.7" dominant-baseline="central">Not disappointed</text>
  </g>
  
  <!-- Roadmap Table (Right Top) -->
  <rect x="320" y="24" width="163" height="112" rx="3" fill="#FFFFFF" stroke="#F0F0F0" stroke-width="0.5"/>
  <text x="328" y="42" font-family="system-ui, -apple-system" font-size="11" fill="#37352F" font-weight="500" opacity="0.9">Roadmap</text>
  
  <!-- Roadmap Items -->
  <g>
    <rect x="328" y="52" width="147" height="18" rx="2" fill="#FAFAFA"/>
    <circle cx="338" cy="61" r="1.5" fill="#F91CE4" opacity="0.7"/>
    <text x="348" y="66" font-family="system-ui, -apple-system" font-size="8" fill="#37352F" opacity="0.7">Improve hackathon templates</text>
    <rect x="420" y="56" width="56" height="9" rx="2" fill="#FCE7F3" opacity="0.6"/>
    <text x="424" y="62" font-family="system-ui, -apple-system" font-size="7" fill="#F91CE4" opacity="0.8">Event Mgmt</text>
    <text x="472" y="66" font-family="system-ui, -apple-system" font-size="7" fill="#9B9A97" opacity="0.6">Q2 2024</text>
  </g>
  
  <g>
    <rect x="328" y="74" width="147" height="18" rx="2" fill="#FAFAFA"/>
    <circle cx="338" cy="83" r="1.5" fill="#1D79FF" opacity="0.7"/>
    <text x="348" y="88" font-family="system-ui, -apple-system" font-size="8" fill="#37352F" opacity="0.7">Enhanced analytics dashboard</text>
    <rect x="420" y="78" width="56" height="9" rx="2" fill="#E8F0FE" opacity="0.6"/>
    <text x="424" y="84" font-family="system-ui, -apple-system" font-size="7" fill="#1D79FF" opacity="0.8">Analytics</text>
    <text x="472" y="88" font-family="system-ui, -apple-system" font-size="7" fill="#9B9A97" opacity="0.6">Q3 2024</text>
  </g>
  
  <g>
    <rect x="328" y="96" width="147" height="18" rx="2" fill="#FAFAFA"/>
    <circle cx="338" cy="105" r="1.5" fill="#28E832" opacity="0.7"/>
    <text x="348" y="110" font-family="system-ui, -apple-system" font-size="8" fill="#37352F" opacity="0.7">Real-time collaboration</text>
    <rect x="420" y="100" width="56" height="9" rx="2" fill="#E8FCE8" opacity="0.6"/>
    <text x="424" y="106" font-family="system-ui, -apple-system" font-size="7" fill="#28E832" opacity="0.8">Features</text>
    <text x="472" y="110" font-family="system-ui, -apple-system" font-size="7" fill="#9B9A97" opacity="0.6">Done</text>
  </g>
  
  <!-- Engagement Growth Chart (Left Bottom) -->
  <rect x="24" y="152" width="220" height="118" rx="3" fill="#FFFFFF" stroke="#F0F0F0" stroke-width="0.5"/>
  <text x="32" y="172" font-family="system-ui, -apple-system" font-size="11" fill="#37352F" font-weight="500" opacity="0.9">Engagement Growth</text>
  
  <!-- Chart Area -->
  <rect x="32" y="184" width="200" height="72" rx="2" fill="#FAFAFA"/>
  
  <!-- Growth Line -->
  <path d="M 40 248 Q 80 230, 120 212 T 200 196 T 220 188" stroke="#1D79FF" stroke-width="2" fill="none" opacity="0.8"/>
  
  <!-- Data Points -->
  <circle cx="40" cy="248" r="2.5" fill="#1D79FF" opacity="0.8"/>
  <circle cx="120" cy="212" r="2.5" fill="#1D79FF" opacity="0.8"/>
  <circle cx="200" cy="196" r="2.5" fill="#1D79FF" opacity="0.8"/>
  <circle cx="220" cy="188" r="2.5" fill="#1D79FF" opacity="0.8"/>
  
  <!-- Y-axis labels -->
  <text x="36" y="252" font-family="system-ui, -apple-system" font-size="7" fill="#9B9A97" opacity="0.6">0</text>
  <text x="36" y="212" font-family="system-ui, -apple-system" font-size="7" fill="#9B9A97" opacity="0.6">500</text>
  <text x="36" y="188" font-family="system-ui, -apple-system" font-size="7" fill="#9B9A97" opacity="0.6">1K+</text>
  
  <!-- X-axis labels -->
  <text x="40" y="260" font-family="system-ui, -apple-system" font-size="7" fill="#9B9A97" opacity="0.6">Jan</text>
  <text x="120" y="260" font-family="system-ui, -apple-system" font-size="7" fill="#9B9A97" opacity="0.6">Mar</text>
  <text x="200" y="260" font-family="system-ui, -apple-system" font-size="7" fill="#9B9A97" opacity="0.6">Jun</text>
  
  <!-- Stats Badge -->
  <rect x="140" y="172" width="76" height="20" rx="3" fill="#1D79FF" opacity="0.08"/>
  <text x="150" y="185" font-family="system-ui, -apple-system" font-size="9" fill="#1D79FF" font-weight="500" opacity="0.9">+250%</text>
  
  <!-- Feedback Form (Right Bottom) -->
  <rect x="260" y="152" width="223" height="118" rx="3" fill="#FFFFFF" stroke="#F0F0F0" stroke-width="0.5"/>
  <text x="268" y="172" font-family="system-ui, -apple-system" font-size="11" fill="#37352F" font-weight="500" opacity="0.9">How can we improve Pacepard for you?</text>
  
  <!-- Text Area -->
  <rect x="268" y="188" width="207" height="58" rx="3" fill="#FAFAFA" stroke="#E9E9E7" stroke-width="0.5"/>
  <text x="276" y="206" font-family="system-ui, -apple-system" font-size="8" fill="#9B9A97" opacity="0.6">Share your thoughts...</text>
  
  <!-- Submit Button -->
  <rect x="368" y="252" width="88" height="26" rx="3" fill="#37352F" opacity="0.9"/>
  <text x="392" y="270" font-family="system-ui, -apple-system" font-size="9" fill="#FFFFFF" font-weight="400">Submit →</text>
</svg>
