<svg width="587" height="294" viewBox="0 0 587 294" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Main Card Background -->
  <rect width="587" height="294" rx="12" fill="#FFFFFF"/>
  
  <!-- Share Link Section - Clean and minimal -->
  <rect x="24" y="24" width="142" height="112" rx="3" fill="#FFFFFF" stroke="#F0F0F0" stroke-width="0.5"/>
  <text x="32" y="42" font-family="system-ui, -apple-system" font-size="13" fill="#37352F" font-weight="500" opacity="0.9">Share Link</text>
  <text x="32" y="58" font-family="system-ui, -apple-system" font-size="9" fill="#9B9A97" opacity="0.7">Share your hackathon</text>
  <rect x="32" y="72" width="102" height="22" rx="3" fill="#FAFAFA" stroke="#E9E9E7" stroke-width="0.5"/>
  <text x="36" y="85" font-family="system-ui, -apple-system" font-size="8" fill="#9B9A97" opacity="0.6">pacepard.com/r/...</text>
  <rect x="32" y="96" width="46" height="26" rx="3" fill="#37352F" opacity="0.9"/>
  <text x="40" y="112" font-family="system-ui, -apple-system" font-size="9" fill="#FFFFFF" font-weight="400">Copy</text>
  
  <!-- Install Okta Integration Card (Replacing Embed Form) -->
  <rect x="180" y="24" width="303" height="112" rx="3" fill="#FFFFFF" stroke="#F0F0F0" stroke-width="0.5"/>
  
  <!-- Step Indicator Badge -->
  <circle cx="192" cy="40" r="8" fill="#FAFAFA" stroke="#E9E9E7" stroke-width="0.5"/>
  <text x="192" y="45" font-family="system-ui, -apple-system" font-size="10" fill="#37352F" font-weight="600" text-anchor="middle">2</text>
  
  <!-- Title Section -->
  <text x="208" y="45" font-family="system-ui, -apple-system" font-size="14" fill="#37352F" font-weight="600" opacity="0.9">Install Okta Integration</text>
  
  <!-- Okta Icon/Branding -->
  <rect x="380" y="32" width="20" height="20" rx="4" fill="#FFFFFF" stroke="#007DC1" stroke-width="1.5"/>
  <text x="390" y="46" font-family="system-ui, -apple-system" font-size="10" fill="#007DC1" font-weight="700" text-anchor="middle">O</text>
  
  <!-- Description -->
  <text x="192" y="62" font-family="system-ui, -apple-system" font-size="10" fill="#9B9A97" opacity="0.7">Add Okta authentication to your hackathon</text>
  
  <!-- Help Link with Lightbulb Icon -->
  <rect x="192" y="72" width="200" height="20" rx="10" fill="#F7F9FC" stroke="#E9E9E7" stroke-width="0.5"/>
  <!-- Lightbulb Icon -->
  <circle cx="200" cy="82" r="3" fill="#1D79FF" opacity="0.6"/>
  <path d="M 200 79 L 200 81 M 198 81 L 202 81 M 199 83 L 201 83" stroke="#1D79FF" stroke-width="1" opacity="0.6" fill="none"/>
  <text x="210" y="85" font-family="system-ui, -apple-system" font-size="9" fill="#37352F" opacity="0.7">New to Okta? Click for setup guide</text>
  <!-- Chevron -->
  <path d="M 380 82 L 382 84 L 380 86" stroke="#9B9A97" stroke-width="1" fill="none" opacity="0.5"/>
  
  <!-- Code Block / Command Line -->
  <rect x="192" y="100" width="283" height="28" rx="4" fill="#FAFAFA" stroke="#E9E9E7" stroke-width="0.5"/>
  
  <!-- Terminal Prompt -->
  <text x="200" y="118" font-family="monospace, 'Courier New'" font-size="10" fill="#9B9A97" opacity="0.6">&gt;_</text>
  
  <!-- Command Text -->
  <text x="220" y="118" font-family="monospace, 'Courier New'" font-size="10" fill="#37352F" opacity="0.8">pnpm i @okta/okta-react @okta/okta-auth-js</text>
  
  <!-- Copy Button Icon -->
  <rect x="450" y="106" width="18" height="18" rx="3" fill="#FFFFFF" stroke="#E9E9E7" stroke-width="0.5"/>
  <!-- Copy Icon (two overlapping squares) -->
  <rect x="453" y="109" width="6" height="6" rx="0.5" fill="none" stroke="#9B9A97" stroke-width="1" opacity="0.5"/>
  <rect x="456" y="112" width="6" height="6" rx="0.5" fill="#FAFAFA" stroke="#9B9A97" stroke-width="1" opacity="0.5"/>
  
  <!-- AI Block Cards Section - Matching Reference UI Style -->
  
  <!-- Card 1: AI SDK Gemini Flash Image Edit -->
  <rect x="24" y="152" width="280" height="118" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
  <!-- Subtle shadow -->
  <rect x="24" y="152" width="280" height="118" rx="8" fill="#000000" opacity="0.03" transform="translate(0, 2)"/>
  
  <!-- Title Section - Larger, bold, black -->
  <text x="32" y="172" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" fill="#000000" font-weight="700">AI SDK</text>
  
  <!-- New Tag - Larger, positioned to the right -->
  <rect x="250" y="160" width="42" height="20" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
  <text x="271" y="173" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="10" fill="#111827" font-weight="500" text-anchor="middle">New</text>
  
  <!-- Description Section - Larger font, proper spacing -->
  <text x="32" y="194" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11" fill="#6B7280">
    <tspan x="32" dy="0">Generate and edit images using Google's</tspan>
    <tspan x="32" dy="16">Gemini 2.5 Flash. Create new images from text</tspan>
    <tspan x="32" dy="16">or edit existing ones with natural language....</tspan>
  </text>
  
  <!-- Tags Section - Larger, pill-shaped -->
  <rect x="32" y="242" width="32" height="20" rx="10" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
  <text x="48" y="255" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="10" fill="#9CA3AF" text-anchor="middle">ai</text>
  
  <rect x="70" y="242" width="100" height="20" rx="10" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
  <text x="120" y="255" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="10" fill="#9CA3AF" text-anchor="middle">image generation</text>
  
  <rect x="178" y="242" width="82" height="20" rx="10" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
  <text x="219" y="255" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="10" fill="#9CA3AF" text-anchor="middle">image editing</text>
  
  <!-- Icons Section - More detailed sparkle with gradient -->
<defs>
    <linearGradient id="sparkle_grad_1" x1="28" y1="256" x2="48" y2="276" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366F1"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
</defs>
  
  <!-- Multi-colored sparkle/diamond icon -->
  <path d="M 32 256 L 34 258 L 32 260 L 34 258 M 30 258 L 36 258 M 34 256 L 34 260" fill="url(#sparkle_grad_1)" opacity="0.8"/>
  <circle cx="42" cy="258" r="2" fill="#EF4444" opacity="0.7"/>
  
  <!-- Green spiral icon -->
  <path d="M 50 256 C 50 252, 54 250, 58 252 C 62 254, 62 258, 58 260 C 54 262, 50 260, 50 256" stroke="#10B981" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M 54 254 C 54 254, 52 254, 51 256 C 50 258, 51 260, 54 260 C 57 260, 58 258, 58 257" stroke="#10B981" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  
  
  <!-- Card 2: AI Artifact Table -->
  <rect x="320" y="152" width="225" height="118" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
  <!-- Subtle shadow -->
  <rect x="320" y="152" width="225" height="118" rx="8" fill="#000000" opacity="0.03" transform="translate(0, 2)"/>
  
  <!-- Title Section - Larger, bold, black -->
  <text x="328" y="172" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" fill="#000000" font-weight="700">AI Artifact Table</text>
  
  <!-- New Tag - Larger -->
  <rect x="491" y="160" width="42" height="20" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
  <text x="512" y="173" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="10" fill="#111827" font-weight="500" text-anchor="middle">New</text>
  
  <!-- Description Section - Larger font -->
  <text x="328" y="194" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11" fill="#6B7280">
    <tspan x="328" dy="0">AI-powered spreadsheet editor with chat interface</tspan>
    <tspan x="328" dy="16">for data analysis and manipulation. Features</tspan>
    <tspan x="328" dy="16">streaming responses and tool chaining.</tspan>
  </text>
  
  <!-- Tags Section - Larger, pill-shaped -->
  <rect x="328" y="242" width="32" height="20" rx="10" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
  <text x="344" y="255" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="10" fill="#9CA3AF" text-anchor="middle">ai</text>
  
  <rect x="366" y="242" width="48" height="20" rx="10" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
  <text x="390" y="255" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="10" fill="#9CA3AF" text-anchor="middle">table</text>
  
  <rect x="422" y="242" width="88" height="20" rx="10" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
  <text x="466" y="255" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="10" fill="#9CA3AF" text-anchor="middle">data analysis</text>
  
  <!-- Icons Section - Black spiral and N in circle -->
  <g opacity="0.8">
    <!-- Black swirling/spiral logo -->
    <path d="M 328 256 C 328 252, 332 250, 336 252 C 340 254, 340 258, 336 260 C 332 262, 328 260, 328 256" stroke="#111827" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 328 256 C 328 254, 330 253, 332 254 C 334 255, 334 257, 332 258 C 330 259, 328 258, 328 256" stroke="#111827" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    
    <!-- Black 'N' in circle -->
    <circle cx="342" cy="258" r="7" fill="#FFFFFF" stroke="#111827" stroke-width="1.5"/>
    <text x="342" y="262" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="10" fill="#111827" text-anchor="middle" font-weight="700">N</text>
  </g>
  
</svg>
