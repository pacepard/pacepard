<svg width="495" height="186" viewBox="0 0 495 186" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Main Background -->
  <rect width="495" height="186" rx="8" fill="#FFFFFF" stroke="#E9E9E7" stroke-width="1"/>
  
  <!-- Header Section -->
  <text x="24" y="36" font-family="system-ui, -apple-system" font-size="16" fill="#37352F" font-weight="600">Create Hackathon Challenge</text>
  <text x="24" y="52" font-family="system-ui, -apple-system" font-size="11" fill="#9B9A97" opacity="0.7">Quick setup in minutes • No complicated tools needed</text>
  
  <!-- Template Cards Row -->
  <g>
    <!-- Template 1: AI Hackathon -->
    <rect x="24" y="68" width="140" height="98" rx="6" fill="#FFFFFF" stroke="#E9E9E7" stroke-width="0.5"/>
    <rect x="32" y="76" width="124" height="8" rx="2" fill="#37352F" opacity="0.1"/>
    <rect x="32" y="90" width="100" height="6" rx="1" fill="#E9E9E7"/>
    <rect x="32" y="102" width="80" height="6" rx="1" fill="#E9E9E7"/>
    <rect x="32" y="114" width="60" height="6" rx="1" fill="#E9E9E7"/>
    <circle cx="140" cy="82" r="3" fill="#1D79FF" opacity="0.2"/>
    <text x="140" y="84" font-family="system-ui, -apple-system" font-size="6" fill="#1D79FF" text-anchor="middle" font-weight="600">✓</text>
    <text x="32" y="134" font-family="system-ui, -apple-system" font-size="10" fill="#37352F" font-weight="500">AI Hackathon</text>
    <text x="32" y="148" font-family="system-ui, -apple-system" font-size="9" fill="#9B9A97" opacity="0.7">48h • 200+ participants</text>
  </g>
  
  <g>
    <!-- Template 2: Startup Weekend (Selected) -->
    <rect x="180" y="68" width="140" height="98" rx="6" fill="#FFFFFF" stroke="#1D79FF" stroke-width="1.5"/>
    <rect x="188" y="76" width="124" height="8" rx="2" fill="#1D79FF" opacity="0.1"/>
    <rect x="188" y="90" width="100" height="6" rx="1" fill="#E9E9E7"/>
    <rect x="188" y="102" width="80" height="6" rx="1" fill="#E9E9E7"/>
    <rect x="188" y="114" width="60" height="6" rx="1" fill="#E9E9E7"/>
    <circle cx="304" cy="82" r="3" fill="#1D79FF"/>
    <text x="304" y="84" font-family="system-ui, -apple-system" font-size="6" fill="#FFFFFF" text-anchor="middle" font-weight="600">✓</text>
    <text x="188" y="134" font-family="system-ui, -apple-system" font-size="10" fill="#1D79FF" font-weight="500">Startup Weekend</text>
    <text x="188" y="148" font-family="system-ui, -apple-system" font-size="9" fill="#9B9A97" opacity="0.7">72h • 150+ participants</text>
  </g>
  
  <g>
    <!-- Template 3: Innovation Challenge -->
    <rect x="336" y="68" width="140" height="98" rx="6" fill="#FFFFFF" stroke="#E9E9E7" stroke-width="0.5"/>
    <rect x="344" y="76" width="124" height="8" rx="2" fill="#37352F" opacity="0.1"/>
    <rect x="344" y="90" width="100" height="6" rx="1" fill="#E9E9E7"/>
    <rect x="344" y="102" width="80" height="6" rx="1" fill="#E9E9E7"/>
    <rect x="344" y="114" width="60" height="6" rx="1" fill="#E9E9E7"/>
    <circle cx="452" cy="82" r="3" fill="#1D79FF" opacity="0.2"/>
    <text x="452" y="84" font-family="system-ui, -apple-system" font-size="6" fill="#1D79FF" text-anchor="middle" font-weight="600">✓</text>
    <text x="344" y="134" font-family="system-ui, -apple-system" font-size="10" fill="#37352F" font-weight="500">Innovation Challenge</text>
    <text x="344" y="148" font-family="system-ui, -apple-system" font-size="9" fill="#9B9A97" opacity="0.7">30 days • 500+ participants</text>
  </g>
  
  <!-- Quick Actions Bar -->
  <g>
    <rect x="24" y="180" width="452" height="32" rx="4" fill="#FAFAFA" stroke="#E9E9E7" stroke-width="0.5"/>
    
    <!-- Challenge Button -->
    <rect x="32" y="188" width="100" height="20" rx="3" fill="#37352F" opacity="0.9"/>
    <text x="82" y="201" font-family="system-ui, -apple-system" font-size="9" fill="#FFFFFF" font-weight="500" text-anchor="middle">Create Challenge</text>
    
    <!-- Register Participants -->
    <rect x="144" y="188" width="120" height="20" rx="3" fill="#FFFFFF" stroke="#E9E9E7" stroke-width="0.5"/>
    <text x="204" y="201" font-family="system-ui, -apple-system" font-size="9" fill="#37352F" text-anchor="middle">Register Participants</text>
    
    <!-- Set Timeline -->
    <rect x="276" y="188" width="100" height="20" rx="3" fill="#FFFFFF" stroke="#E9E9E7" stroke-width="0.5"/>
    <text x="326" y="201" font-family="system-ui, -apple-system" font-size="9" fill="#37352F" text-anchor="middle">Set Timeline</text>
    
    <!-- Plus Button -->
    <rect x="388" y="188" width="80" height="20" rx="3" fill="#1D79FF" opacity="0.1"/>
    <line x1="408" y1="198" x2="428" y2="198" stroke="#1D79FF" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="418" y1="188" x2="418" y2="208" stroke="#1D79FF" stroke-width="1.5" stroke-linecap="round"/>
    <text x="428" y="201" font-family="system-ui, -apple-system" font-size="9" fill="#1D79FF" font-weight="500">New Template</text>
  </g>
</svg>
