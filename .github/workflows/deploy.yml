# Deploy: build Docker images in GitHub Actions, push to GHCR (dual tags), trigger Coolify.
#
# Coolify — two options:
#
# (1) Docker Image only (new resources): ghcr.io/<lowercase-org>/pacepard-<api|web|app|service>:<env>
#
# (2) Docker Compose + pre-built image (Git-based apps): set Build Pack to Docker Compose and use:
#     deploy/coolify/docker-compose.web.yaml | .api.yaml | .app.yaml | .service.yaml
#     Set Coolify environment variables GHCR_ORG (lowercase GitHub org/user) and
#     IMAGE_TAG = development | staging | production. Compose pulls image only (no build:).
#     pacepard-service: CI pushes on every production (master) push so :production exists for Coolify.
#
# Floating tag = environment; CI also pushes immutable :<env>-<shortsha>.
# Private GHCR: registry credentials in Coolify (ghcr.io + read-only PAT with read:packages).
#
# GitHub: Actions "Read and write" (packages: write) or PAT with write:packages.
# Secrets: COOLIFY_API_TOKEN, COOLIFY_APP_UUID_* ; optional TURBO_TOKEN.
# TIPTAP_PRO_TOKEN: TipTap Pro Extensions NPM token (https://cloud.tiptap.dev/v2/features/pro-extensions).
# Required for pacepard-app and pacepard-api Docker builds (blocs / editor deps). pacepard-web does not
# use TipTap Pro — its Dockerfile installs only @pacepard/web... and apps/web/docker.npmrc.
# Variables: COOLIFY_API_URL, TURBO_TEAM, per-env URLs.

name: Deploy

on:
  push:
    branches:
      - development
      - staging
      - master
    paths-ignore:
      - '**.md'
      - '.changeset/**'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - development
          - staging
          - production
      apps:
        description: 'Apps to deploy (comma-separated: api,web,app,service)'
        required: false
        default: 'api,web,app,service'

permissions:
  contents: read
  packages: write

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9.0.0'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.environment || (github.ref_name == 'master' && 'production' || (github.ref_name == 'staging' && 'staging' || 'development')) }}
  cancel-in-progress: false

jobs:
  determine-environment:
    name: Determine Environment
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.set-env.outputs.env }}
    steps:
      - name: Set environment
        id: set-env
        run: |
          if [ "${{ github.event.inputs.environment }}" != "" ]; then
            echo "env=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" == "master" ]; then
            echo "env=production" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" == "staging" ]; then
            echo "env=staging" >> $GITHUB_OUTPUT
          else
            echo "env=development" >> $GITHUB_OUTPUT
          fi

  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.changes.outputs.api }}
      web: ${{ steps.changes.outputs.web }}
      app: ${{ steps.changes.outputs.app }}
      service: ${{ steps.changes.outputs.service }}
    steps:
      - name: Checkout code
        if: github.event_name == 'push'
        uses: actions/checkout@v4

      - name: Detect file changes
        if: github.event_name == 'push'
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            shared:
              - 'packages/**'
              - 'configs/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'tsconfig.json'
              - '.npmrc*'
              - '.github/workflows/deploy.yml'
            api:
              - 'apps/api/**'
            web:
              - 'apps/web/**'
            app:
              - 'apps/main/**'
            service:
              - 'apps/service/**'

      - name: Set outputs
        id: changes
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "api=true" >> $GITHUB_OUTPUT
            echo "web=true" >> $GITHUB_OUTPUT
            echo "app=true" >> $GITHUB_OUTPUT
            echo "service=true" >> $GITHUB_OUTPUT
          else
            SHARED="${{ steps.filter.outputs.shared }}"
            echo "api=${{ steps.filter.outputs.api == 'true' || steps.filter.outputs.shared == 'true' }}" >> $GITHUB_OUTPUT
            echo "web=${{ steps.filter.outputs.web == 'true' || steps.filter.outputs.shared == 'true' }}" >> $GITHUB_OUTPUT
            echo "app=${{ steps.filter.outputs.app == 'true' || steps.filter.outputs.shared == 'true' }}" >> $GITHUB_OUTPUT
            echo "service=${{ steps.filter.outputs.service == 'true' || steps.filter.outputs.shared == 'true' }}" >> $GITHUB_OUTPUT
          fi

  # ---------------------------------------------------------------------------
  # Build jobs — one per app, gated by detect-changes
  # ---------------------------------------------------------------------------

  build-api:
    name: Build and push (pacepard-api)
    runs-on: ubuntu-latest
    needs: [determine-environment, detect-changes]
    if: needs.detect-changes.outputs.api == 'true'
    timeout-minutes: 30
    environment:
      name: ${{ needs.determine-environment.outputs.env }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and registry namespace
        id: meta
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          SHA=$(echo '${{ github.sha }}' | cut -c1-7)
          FLOAT='${{ needs.determine-environment.outputs.env }}'
          echo "owner=$OWNER" >> $GITHUB_OUTPUT
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "float=$FLOAT" >> $GITHUB_OUTPUT

      - name: Check TipTap registry token
        env:
          TIPTAP_PRO_TOKEN: ${{ secrets.TIPTAP_PRO_TOKEN }}
        run: |
          if [ -z "$TIPTAP_PRO_TOKEN" ]; then
            echo "::error::TIPTAP_PRO_TOKEN is empty."
            exit 1
          fi

      - name: Build and push Docker image
        env:
          DOCKER_BUILDKIT: 1
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
          TIPTAP_PRO_TOKEN: ${{ secrets.TIPTAP_PRO_TOKEN }}
        run: |
          OWNER="${{ steps.meta.outputs.owner }}"
          FLOAT="${{ steps.meta.outputs.float }}"
          SHA="${{ steps.meta.outputs.sha }}"
          docker buildx build \
            --push \
            --cache-from type=gha,scope=pacepard-api \
            --cache-to type=gha,mode=max,scope=pacepard-api \
            --build-arg TURBO_TOKEN \
            --build-arg TURBO_TEAM \
            --build-arg TIPTAP_PRO_TOKEN \
            -f apps/api/Dockerfile \
            -t "ghcr.io/${OWNER}/pacepard-api:${FLOAT}" \
            -t "ghcr.io/${OWNER}/pacepard-api:${FLOAT}-${SHA}" \
            .

  build-web:
    name: Build and push (pacepard-web)
    runs-on: ubuntu-latest
    needs: [determine-environment, detect-changes]
    if: needs.detect-changes.outputs.web == 'true'
    timeout-minutes: 30
    environment:
      name: ${{ needs.determine-environment.outputs.env }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and registry namespace
        id: meta
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          SHA=$(echo '${{ github.sha }}' | cut -c1-7)
          FLOAT='${{ needs.determine-environment.outputs.env }}'
          echo "owner=$OWNER" >> $GITHUB_OUTPUT
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "float=$FLOAT" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        env:
          DOCKER_BUILDKIT: 1
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
        run: |
          OWNER="${{ steps.meta.outputs.owner }}"
          FLOAT="${{ steps.meta.outputs.float }}"
          SHA="${{ steps.meta.outputs.sha }}"
          docker buildx build \
            --push \
            --cache-from type=gha,scope=pacepard-web \
            --cache-to type=gha,mode=max,scope=pacepard-web \
            --build-arg TURBO_TOKEN \
            --build-arg TURBO_TEAM \
            -f apps/web/Dockerfile \
            -t "ghcr.io/${OWNER}/pacepard-web:${FLOAT}" \
            -t "ghcr.io/${OWNER}/pacepard-web:${FLOAT}-${SHA}" \
            .

  build-app:
    name: Build and push (pacepard-app)
    runs-on: ubuntu-latest
    needs: [determine-environment, detect-changes]
    if: needs.detect-changes.outputs.app == 'true'
    timeout-minutes: 30
    environment:
      name: ${{ needs.determine-environment.outputs.env }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and registry namespace
        id: meta
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          SHA=$(echo '${{ github.sha }}' | cut -c1-7)
          FLOAT='${{ needs.determine-environment.outputs.env }}'
          echo "owner=$OWNER" >> $GITHUB_OUTPUT
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "float=$FLOAT" >> $GITHUB_OUTPUT

      - name: Check TipTap registry token
        env:
          TIPTAP_PRO_TOKEN: ${{ secrets.TIPTAP_PRO_TOKEN }}
        run: |
          if [ -z "$TIPTAP_PRO_TOKEN" ]; then
            echo "::error::TIPTAP_PRO_TOKEN is empty."
            exit 1
          fi

      - name: Build and push Docker image
        env:
          DOCKER_BUILDKIT: 1
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
          TIPTAP_PRO_TOKEN: ${{ secrets.TIPTAP_PRO_TOKEN }}
          VITE_APP_API_URL: ${{ vars.API_URL }}
        run: |
          OWNER="${{ steps.meta.outputs.owner }}"
          FLOAT="${{ steps.meta.outputs.float }}"
          SHA="${{ steps.meta.outputs.sha }}"
          docker buildx build \
            --push \
            --cache-from type=gha,scope=pacepard-app \
            --cache-to type=gha,mode=max,scope=pacepard-app \
            --build-arg TURBO_TOKEN \
            --build-arg TURBO_TEAM \
            --build-arg TIPTAP_PRO_TOKEN \
            --build-arg VITE_APP_API_URL \
            -f apps/main/Dockerfile \
            -t "ghcr.io/${OWNER}/pacepard-app:${FLOAT}" \
            -t "ghcr.io/${OWNER}/pacepard-app:${FLOAT}-${SHA}" \
            .

  # Service app: production only — always push image on master so GHCR tag exists for Coolify pulls.
  build-service:
    name: Build and push (pacepard-service)
    runs-on: ubuntu-latest
    needs: [determine-environment, detect-changes]
    if: needs.determine-environment.outputs.env == 'production'
    timeout-minutes: 30
    environment:
      name: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and registry namespace
        id: meta
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          SHA=$(echo '${{ github.sha }}' | cut -c1-7)
          FLOAT='${{ needs.determine-environment.outputs.env }}'
          echo "owner=$OWNER" >> $GITHUB_OUTPUT
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "float=$FLOAT" >> $GITHUB_OUTPUT

      - name: Check TipTap registry token
        env:
          TIPTAP_PRO_TOKEN: ${{ secrets.TIPTAP_PRO_TOKEN }}
        run: |
          if [ -z "$TIPTAP_PRO_TOKEN" ]; then
            echo "::error::TIPTAP_PRO_TOKEN is empty. Add it to the production GitHub Environment or repository Actions secrets."
            exit 1
          fi

      - name: Build and push Docker image
        env:
          DOCKER_BUILDKIT: 1
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
          TIPTAP_PRO_TOKEN: ${{ secrets.TIPTAP_PRO_TOKEN }}
        run: |
          OWNER="${{ steps.meta.outputs.owner }}"
          FLOAT="${{ steps.meta.outputs.float }}"
          SHA="${{ steps.meta.outputs.sha }}"
          docker buildx build \
            --push \
            --cache-from type=gha,scope=pacepard-service \
            --cache-to type=gha,mode=max,scope=pacepard-service \
            --build-arg TURBO_TOKEN \
            --build-arg TURBO_TEAM \
            --build-arg TIPTAP_PRO_TOKEN \
            -f apps/service/Dockerfile \
            -t "ghcr.io/${OWNER}/pacepard-service:${FLOAT}" \
            -t "ghcr.io/${OWNER}/pacepard-service:${FLOAT}-${SHA}" \
            .

  # ---------------------------------------------------------------------------
  # Deploy jobs — gated by detect-changes, depend on their build job
  # ---------------------------------------------------------------------------

  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    needs: [build-api, detect-changes, determine-environment]
    if: needs.detect-changes.outputs.api == 'true'
    environment:
      name: ${{ needs.determine-environment.outputs.env }}
      url: ${{ vars.API_URL }}

    steps:
      - name: Deploy to Coolify via API
        env:
          COOLIFY_API_URL: ${{ vars.COOLIFY_API_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID_API }}
        run: |
          if [ -z "$COOLIFY_API_TOKEN" ] || [ -z "$COOLIFY_APP_UUID" ]; then
            echo "Coolify API token or application UUID not configured"
            exit 1
          fi

          echo "Triggering deployment for API application..."
          response=$(curl -s -w "\n%{http_code}" -X GET \
            "$COOLIFY_API_URL/api/v1/deploy?uuid=$COOLIFY_APP_UUID&force=false" \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
            -H "Content-Type: application/json")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          if [ "$http_code" -eq 200 ] || [ "$http_code" -eq 201 ]; then
            echo "Deployment triggered successfully"
            echo "$body"
          else
            echo "Deployment failed with HTTP $http_code"
            echo "$body"
            exit 1
          fi

      - name: Deployment status
        run: echo "API deployment triggered to ${{ needs.determine-environment.outputs.env }}"

  deploy-web:
    name: Deploy Web
    runs-on: ubuntu-latest
    needs: [build-web, detect-changes, determine-environment]
    if: needs.detect-changes.outputs.web == 'true'
    environment:
      name: ${{ needs.determine-environment.outputs.env }}
      url: ${{ vars.WEB_URL }}

    steps:
      - name: Deploy to Coolify via API
        env:
          COOLIFY_API_URL: ${{ vars.COOLIFY_API_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID_WEB }}
        run: |
          if [ -z "$COOLIFY_API_TOKEN" ] || [ -z "$COOLIFY_APP_UUID" ]; then
            echo "Coolify API token or application UUID not configured"
            exit 1
          fi

          echo "Triggering deployment for Web application..."
          response=$(curl -s -w "\n%{http_code}" -X GET \
            "$COOLIFY_API_URL/api/v1/deploy?uuid=$COOLIFY_APP_UUID&force=false" \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
            -H "Content-Type: application/json")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          if [ "$http_code" -eq 200 ] || [ "$http_code" -eq 201 ]; then
            echo "Deployment triggered successfully"
            echo "$body"
          else
            echo "Deployment failed with HTTP $http_code"
            echo "$body"
            exit 1
          fi

      - name: Deployment status
        run: echo "Web deployment triggered to ${{ needs.determine-environment.outputs.env }}"

  deploy-app:
    name: Deploy App
    runs-on: ubuntu-latest
    needs: [build-app, detect-changes, determine-environment]
    if: needs.detect-changes.outputs.app == 'true'
    environment:
      name: ${{ needs.determine-environment.outputs.env }}
      url: ${{ vars.APP_URL }}

    steps:
      - name: Deploy to Coolify via API
        env:
          COOLIFY_API_URL: ${{ vars.COOLIFY_API_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID_APP }}
        run: |
          if [ -z "$COOLIFY_API_TOKEN" ] || [ -z "$COOLIFY_APP_UUID" ]; then
            echo "Coolify API token or application UUID not configured"
            exit 1
          fi

          echo "Triggering deployment for App application..."
          response=$(curl -s -w "\n%{http_code}" -X GET \
            "$COOLIFY_API_URL/api/v1/deploy?uuid=$COOLIFY_APP_UUID&force=false" \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
            -H "Content-Type: application/json")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          if [ "$http_code" -eq 200 ] || [ "$http_code" -eq 201 ]; then
            echo "Deployment triggered successfully"
            echo "$body"
          else
            echo "Deployment failed with HTTP $http_code"
            echo "$body"
            exit 1
          fi

      - name: Deployment status
        run: echo "App deployment triggered to ${{ needs.determine-environment.outputs.env }}"

  deploy-service:
    name: Deploy Service
    runs-on: ubuntu-latest
    needs: [determine-environment, detect-changes, build-service]
    if: needs.determine-environment.outputs.env == 'production' && needs.detect-changes.outputs.service == 'true'
    environment:
      name: ${{ needs.determine-environment.outputs.env }}
      url: ${{ vars.SERVICE_URL }}

    steps:
      - name: Deploy to Coolify via API
        env:
          COOLIFY_API_URL: ${{ vars.COOLIFY_API_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID_SERVICE }}
        run: |
          if [ -z "$COOLIFY_API_TOKEN" ] || [ -z "$COOLIFY_APP_UUID" ]; then
            echo "Coolify API token or application UUID not configured"
            exit 1
          fi

          echo "Triggering deployment for Service application..."
          response=$(curl -s -w "\n%{http_code}" -X GET \
            "$COOLIFY_API_URL/api/v1/deploy?uuid=$COOLIFY_APP_UUID&force=false" \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
            -H "Content-Type: application/json")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          if [ "$http_code" -eq 200 ] || [ "$http_code" -eq 201 ]; then
            echo "Deployment triggered successfully"
            echo "$body"
          else
            echo "Deployment failed with HTTP $http_code"
            echo "$body"
            exit 1
          fi

      - name: Deployment status
        run: echo "Service deployment triggered to ${{ needs.determine-environment.outputs.env }}"
