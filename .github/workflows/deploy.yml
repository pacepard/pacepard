# Deploy: build Docker images in GitHub Actions, push to GHCR (dual tags), trigger Coolify.
#
# Coolify — two options:
#
# (1) Docker Image only (new resources): ghcr.io/<lowercase-org>/pacepard-<api|web|app|service>:<env>
#
# (2) Docker Compose + pre-built image (Git-based apps): set Build Pack to Docker Compose and use:
#     deploy/coolify/docker-compose.web.yaml | .api.yaml | .app.yaml | .service.yaml
#     Set Coolify environment variables GHCR_ORG (lowercase GitHub org/user) and
#     IMAGE_TAG = development | staging | production. Compose pulls image only (no build:).
#     pacepard-service: use compose only where CI pushes (production).
#
# Floating tag = environment; CI also pushes immutable :<env>-<shortsha>.
# Private GHCR: registry credentials in Coolify (ghcr.io + read-only PAT with read:packages).
#
# GitHub: Actions "Read and write" (packages: write) or PAT with write:packages.
# Secrets: COOLIFY_API_TOKEN, COOLIFY_APP_UUID_* ; optional TURBO_TOKEN.
# TIPTAP_PRO_TOKEN: TipTap Pro Extensions NPM token (https://cloud.tiptap.dev/v2/features/pro-extensions).
# Must allow @tiptap-pro/extension-ai for your plan. Put on the repo OR on each GitHub Environment
# (development, staging, production) — image build jobs use the same environment so env-only secrets work.
# Variables: COOLIFY_API_URL, TURBO_TEAM, per-env URLs.

name: Deploy

on:
  push:
    branches:
      - development
      - staging
      - master
    paths-ignore:
      - '**.md'
      - '.changeset/**'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - development
          - staging
          - production
      apps:
        description: 'Apps to deploy (comma-separated: api,web,app,service)'
        required: false
        default: 'api,web,app,service'

permissions:
  contents: read
  packages: write

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9.0.0'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.environment || (github.ref_name == 'master' && 'production' || (github.ref_name == 'staging' && 'staging' || 'development')) }}
  cancel-in-progress: false

jobs:
  determine-environment:
    name: Determine Environment
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.set-env.outputs.env }}
    steps:
      - name: Set environment
        id: set-env
        run: |
          if [ "${{ github.event.inputs.environment }}" != "" ]; then
            echo "env=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" == "master" ]; then
            echo "env=production" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" == "staging" ]; then
            echo "env=staging" >> $GITHUB_OUTPUT
          else
            echo "env=development" >> $GITHUB_OUTPUT
          fi

  build-and-push-images:
    name: Build and push (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: [determine-environment]
    timeout-minutes: 90
    # Same GitHub Environment as deploy jobs so TIPTAP_PRO_TOKEN (and similar) can be env-scoped secrets.
    environment:
      name: ${{ needs.determine-environment.outputs.env }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: pacepard-api
            dockerfile: apps/api/Dockerfile
          - image: pacepard-web
            dockerfile: apps/web/Dockerfile
          - image: pacepard-app
            dockerfile: apps/main/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and registry namespace
        id: meta
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          SHA=$(echo '${{ github.sha }}' | cut -c1-7)
          FLOAT='${{ needs.determine-environment.outputs.env }}'
          echo "owner=$OWNER" >> $GITHUB_OUTPUT
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "float=$FLOAT" >> $GITHUB_OUTPUT
          echo "Primary: ghcr.io/${OWNER}/${{ matrix.image }}:${FLOAT}"
          echo "Immutable: ghcr.io/${OWNER}/${{ matrix.image }}:${FLOAT}-${SHA}"

      - name: Check TipTap registry token
        env:
          TIPTAP_PRO_TOKEN: ${{ secrets.TIPTAP_PRO_TOKEN }}
        run: |
          if [ -z "$TIPTAP_PRO_TOKEN" ]; then
            echo "::error::TIPTAP_PRO_TOKEN is empty. Add it under Settings > Secrets and variables > Actions (repository), or under Environments > ${{ needs.determine-environment.outputs.env }} so this build can read it."
            exit 1
          fi

      - name: Build and push Docker image
        env:
          DOCKER_BUILDKIT: 1
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
          TIPTAP_PRO_TOKEN: ${{ secrets.TIPTAP_PRO_TOKEN }}
        run: |
          OWNER="${{ steps.meta.outputs.owner }}"
          FLOAT="${{ steps.meta.outputs.float }}"
          SHA="${{ steps.meta.outputs.sha }}"
          docker buildx build \
            --push \
            --build-arg "TURBO_TOKEN=${TURBO_TOKEN:-}" \
            --build-arg "TURBO_TEAM=${TURBO_TEAM:-}" \
            --build-arg "TIPTAP_PRO_TOKEN=${TIPTAP_PRO_TOKEN:-}" \
            -f "${{ matrix.dockerfile }}" \
            -t "ghcr.io/${OWNER}/${{ matrix.image }}:${FLOAT}" \
            -t "ghcr.io/${OWNER}/${{ matrix.image }}:${FLOAT}-${SHA}" \
            .

  # Service app: production only (no GHCR push / Coolify deploy for staging or development).
  build-and-push-service:
    name: Build and push (pacepard-service)
    runs-on: ubuntu-latest
    needs: [determine-environment]
    if: needs.determine-environment.outputs.env == 'production'
    timeout-minutes: 90
    environment:
      name: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and registry namespace
        id: meta
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          SHA=$(echo '${{ github.sha }}' | cut -c1-7)
          FLOAT='${{ needs.determine-environment.outputs.env }}'
          echo "owner=$OWNER" >> $GITHUB_OUTPUT
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "float=$FLOAT" >> $GITHUB_OUTPUT

      - name: Check TipTap registry token
        env:
          TIPTAP_PRO_TOKEN: ${{ secrets.TIPTAP_PRO_TOKEN }}
        run: |
          if [ -z "$TIPTAP_PRO_TOKEN" ]; then
            echo "::error::TIPTAP_PRO_TOKEN is empty. Add it to the production GitHub Environment or repository Actions secrets."
            exit 1
          fi

      - name: Build and push Docker image
        env:
          DOCKER_BUILDKIT: 1
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
          TIPTAP_PRO_TOKEN: ${{ secrets.TIPTAP_PRO_TOKEN }}
        run: |
          OWNER="${{ steps.meta.outputs.owner }}"
          FLOAT="${{ steps.meta.outputs.float }}"
          SHA="${{ steps.meta.outputs.sha }}"
          docker buildx build \
            --push \
            --build-arg "TURBO_TOKEN=${TURBO_TOKEN:-}" \
            --build-arg "TURBO_TEAM=${TURBO_TEAM:-}" \
            --build-arg "TIPTAP_PRO_TOKEN=${TIPTAP_PRO_TOKEN:-}" \
            -f apps/service/Dockerfile \
            -t "ghcr.io/${OWNER}/pacepard-service:${FLOAT}" \
            -t "ghcr.io/${OWNER}/pacepard-service:${FLOAT}-${SHA}" \
            .

  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    needs: [build-and-push-images, determine-environment]
    environment:
      name: ${{ needs.determine-environment.outputs.env }}
      url: ${{ vars.API_URL }}

    steps:
      - name: Deploy to Coolify via API
        env:
          COOLIFY_API_URL: ${{ vars.COOLIFY_API_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID_API }}
        run: |
          if [ -z "$COOLIFY_API_TOKEN" ] || [ -z "$COOLIFY_APP_UUID" ]; then
            echo "Coolify API token or application UUID not configured"
            exit 1
          fi

          echo "Triggering deployment for API application..."
          response=$(curl -s -w "\n%{http_code}" -X GET \
            "$COOLIFY_API_URL/api/v1/deploy?uuid=$COOLIFY_APP_UUID&force=false" \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
            -H "Content-Type: application/json")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          if [ "$http_code" -eq 200 ] || [ "$http_code" -eq 201 ]; then
            echo "Deployment triggered successfully"
            echo "$body"
          else
            echo "Deployment failed with HTTP $http_code"
            echo "$body"
            exit 1
          fi

      - name: Deployment status
        run: echo "API deployment triggered to ${{ needs.determine-environment.outputs.env }}"

  deploy-web:
    name: Deploy Web
    runs-on: ubuntu-latest
    needs: [build-and-push-images, determine-environment]
    environment:
      name: ${{ needs.determine-environment.outputs.env }}
      url: ${{ vars.WEB_URL }}

    steps:
      - name: Deploy to Coolify via API
        env:
          COOLIFY_API_URL: ${{ vars.COOLIFY_API_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID_WEB }}
        run: |
          if [ -z "$COOLIFY_API_TOKEN" ] || [ -z "$COOLIFY_APP_UUID" ]; then
            echo "Coolify API token or application UUID not configured"
            exit 1
          fi

          echo "Triggering deployment for Web application..."
          response=$(curl -s -w "\n%{http_code}" -X GET \
            "$COOLIFY_API_URL/api/v1/deploy?uuid=$COOLIFY_APP_UUID&force=false" \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
            -H "Content-Type: application/json")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          if [ "$http_code" -eq 200 ] || [ "$http_code" -eq 201 ]; then
            echo "Deployment triggered successfully"
            echo "$body"
          else
            echo "Deployment failed with HTTP $http_code"
            echo "$body"
            exit 1
          fi

      - name: Deployment status
        run: echo "Web deployment triggered to ${{ needs.determine-environment.outputs.env }}"

  deploy-app:
    name: Deploy App
    runs-on: ubuntu-latest
    needs: [build-and-push-images, determine-environment]
    environment:
      name: ${{ needs.determine-environment.outputs.env }}
      url: ${{ vars.APP_URL }}

    steps:
      - name: Deploy to Coolify via API
        env:
          COOLIFY_API_URL: ${{ vars.COOLIFY_API_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID_APP }}
        run: |
          if [ -z "$COOLIFY_API_TOKEN" ] || [ -z "$COOLIFY_APP_UUID" ]; then
            echo "Coolify API token or application UUID not configured"
            exit 1
          fi

          echo "Triggering deployment for App application..."
          response=$(curl -s -w "\n%{http_code}" -X GET \
            "$COOLIFY_API_URL/api/v1/deploy?uuid=$COOLIFY_APP_UUID&force=false" \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
            -H "Content-Type: application/json")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          if [ "$http_code" -eq 200 ] || [ "$http_code" -eq 201 ]; then
            echo "Deployment triggered successfully"
            echo "$body"
          else
            echo "Deployment failed with HTTP $http_code"
            echo "$body"
            exit 1
          fi

      - name: Deployment status
        run: echo "App deployment triggered to ${{ needs.determine-environment.outputs.env }}"

  deploy-service:
    name: Deploy Service
    runs-on: ubuntu-latest
    needs: [determine-environment, build-and-push-service]
    if: needs.determine-environment.outputs.env == 'production'
    environment:
      name: ${{ needs.determine-environment.outputs.env }}
      url: ${{ vars.SERVICE_URL }}

    steps:
      - name: Deploy to Coolify via API
        env:
          COOLIFY_API_URL: ${{ vars.COOLIFY_API_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID_SERVICE }}
        run: |
          if [ -z "$COOLIFY_API_TOKEN" ] || [ -z "$COOLIFY_APP_UUID" ]; then
            echo "Coolify API token or application UUID not configured"
            exit 1
          fi

          echo "Triggering deployment for Service application..."
          response=$(curl -s -w "\n%{http_code}" -X GET \
            "$COOLIFY_API_URL/api/v1/deploy?uuid=$COOLIFY_APP_UUID&force=false" \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
            -H "Content-Type: application/json")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          if [ "$http_code" -eq 200 ] || [ "$http_code" -eq 201 ]; then
            echo "Deployment triggered successfully"
            echo "$body"
          else
            echo "Deployment failed with HTTP $http_code"
            echo "$body"
            exit 1
          fi

      - name: Deployment status
        run: echo "Service deployment triggered to ${{ needs.determine-environment.outputs.env }}"
